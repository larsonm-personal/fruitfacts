name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    defaults:
      run:
        working-directory: ./frontend
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Use Node.js
      uses: actions/setup-node@v7.1.0
      with:
        node-version: '24.22.1' # match version in get_ubuntu_dependencies.sh
    - run: npm install
    - run: npm run lint
    - run: npm run build
    - run: npm test
