name: Backend tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: ./download_files.sh
      - run: cp backend/.env.example backend/.env
      - run: cargo test --locked --no-default-features --lib -- --include-ignored
        working-directory: backend
      - run: cargo build --locked --release --no-default-features --bin harvest-chart-server
        working-directory: backend
