name: backend test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, update/dependency-modernization ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    defaults:
      run:
        working-directory: ./backend
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        # The importer reads historical commits to date reference publications.
        fetch-depth: 0
    - name: Prepare build inputs
      run: |
        cp .env.example .env
        ../download_files.sh
    - name: Install lint components
      run: rustup component add clippy rustfmt
    - name: Check formatting and both feature configurations
      run: ./rust_lint.sh
    - name: Build
      run: cargo build --verbose
    - name: Run tests including database import
      run: cargo test --verbose -- --include-ignored
    - name: Test server-only configuration
      run: cargo test --no-default-features --lib
    - name: Build production server
      run: cargo build --release --no-default-features --bin harvest-chart-server
