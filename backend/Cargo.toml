[package]
name = "harvest-chart-server"
default-run = "harvest-chart-server"
version = "0.1.0"
edition = "2021"

[lib]
doctest = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
diesel = { version = "2.3", features = ["sqlite", "r2d2"] }
diesel_migrations = "2.3"

# Keep the SQLite binding compatible with Diesel 2.3.
libsqlite3-sys = { version = "0.35", features = ["bundled"] }

actix-cors = "0.7"
# nginx talks HTTP/1 to this API; exclude unused HTTP/2 and its vulnerable h2 0.3 dependency.
actix-web = { version = "4.18", default-features = false, features = ["macros", "compress-brotli", "compress-gzip", "compress-zstd", "cookies", "unicode", "compat"] }
anyhow = "1.0.69"
base64 = "0.21.0"
chrono = "0.4.23"
clap = {version = "4.1.4", features = ["cargo"] }
dotenv-build = "0.1.1"
env_logger = "0.10.0"
expiring_map = { git = "https://github.com/larsonmpdx/expiring_map/", branch = "remove_item" }
git2 = "0.21"
indexmap = "1.9.2"
itertools = "0.10.5"
json5 = "0.4.1"
lazy_static = "1.4.0"
more-asserts = "0.3"
oauth2 = { version = "5", default-features = false, features = ["reqwest-blocking", "native-tls"] }
once_cell = "1.17.0"
pathdiff = "0.2.1"
rand = "0.8.5"
regex = "1.7.1"
reqwest = { version = "0.12", features = ["blocking"] }
serde = {version = "1.0.152", features = ["derive"] }
serde_derive = "1.0.152"
serde_json = "1.0.93"
serde_with = "2.2.0"
urlencoding = "2.1.2"
walkdir = "2.3.2"

# dependencies only used by support binaries (I don't want to download and build these when doing a server release)
pdfium-render = { version = "0.7.29", optional = true }
image = { version = "0.24.5", optional = true }

[features]
default = ["binaries"]
binaries = ["dep:pdfium-render", "dep:image"]

[build-dependencies]
dotenv-build = "0.1.1"
