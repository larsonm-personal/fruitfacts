[package]
name = "harvest-chart-server"
default-run = "harvest-chart-server"
version = "0.1.0"
edition = "2021"

[lib]
doctest = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
diesel = { version = "=2.3.14", features = ["sqlite", "r2d2"] }
diesel_migrations = "=2.3.2"

# Keep the bundled SQLite binding within Diesel's supported range.
libsqlite3-sys = { version = "=0.38.2", features = ["bundled"] }

actix-cors = "=0.7.2"
actix-web = "=4.18.0"
anyhow = "=1.0.104"
base64 = "=0.23.1"
chrono = "=0.4.45"
clap = {version = "=4.6.7", features = ["cargo"] }
dotenv-build = "=0.1.1"
env_logger = "=0.11.11"
expiring_map = { git = "https://github.com/larsonmpdx/expiring_map/", rev = "00e8ec1b68232e41e9bfa11c6ad9b8c6c1405c4b" }
git2 = "=0.21.0"
indexmap = "=2.14.2"
itertools = "=0.15.0"
json5 = "=1.3.3"
lazy_static = "=1.5.1"
more-asserts = "=0.3.1"
oauth2 = { version = "=5.0.0", features = ["reqwest-blocking", "timing-resistant-secret-traits"] }
once_cell = "=1.21.4"
pathdiff = "=0.2.3"
rand = "=0.10.3"
regex = "=1.13.1"
reqwest = { version = "=0.13.5", features = ["blocking"] }
serde = {version = "=1.0.229", features = ["derive"] }
serde_derive = "=1.0.229"
serde_json = "=1.0.154"
serde_with = "=3.24.0"
urlencoding = "=2.1.3"
walkdir = "=2.5.0"

# dependencies only used by support binaries (I don't want to download and build these when doing a server release)
pdfium-render = { version = "=0.9.4", optional = true }
image = { version = "=0.25.10", optional = true }

[features]
default = ["binaries"]
binaries = ["dep:pdfium-render", "dep:image"]

[build-dependencies]
dotenv-build = "=0.1.1"
