[package]
name = "harvest-chart-server"
default-run = "harvest-chart-server"
version = "0.1.0"
edition = "2021"

[lib]
doctest = false

[[bin]]
name = "delete_extra_thumbnails"
path = "src/bin/delete_extra_thumbnails.rs"
required-features = ["binaries"]

[[bin]]
name = "pdf_to_thumbnail"
path = "src/bin/pdf_to_thumbnail.rs"
required-features = ["binaries"]

[[bin]]
name = "web_thumbnails"
path = "src/bin/web_thumbnails.rs"
required-features = ["binaries"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
diesel = { version = "=2.2.6", features = ["sqlite", "r2d2"] }
diesel_migrations = "=2.2.0"

# this has to be within the allowed versions for diesel-rs - note we're on the 2.0.x branch (latest stable)
# see https://github.com/diesel-rs/diesel/blob/2.0.x/diesel/Cargo.toml#L19
# see versions here https://crates.io/crates/libsqlite3-sys/versions
libsqlite3-sys = { version = "=0.30.1", features = ["bundled"] }

actix-cors = "=0.7.0"
actix-web = "=4.9.0"
anyhow = "=1.0.95"
base64 = "=0.22.1"
chrono = "=0.4.39"
clap = { version = "=4.5.26", features = ["cargo"] }
dotenv-build = "=0.1.1"
env_logger = "=0.11.6"
expiring_map = { git = "https://github.com/larsonmpdx/expiring_map/", branch = "remove_item" }
git2 = "=0.20.0"
indexmap = "=2.7.0"
itertools = "=0.14.0"
json5 = "=0.4.1"
lazy_static = "=1.5.0"
more-asserts = "=0.3.1"
oauth2 = "=4.4.2"
once_cell = "=1.20.2"
pathdiff = "=0.2.3"
rand = "=0.8.5"
regex = "=1.11.1"
reqwest = { version = "=0.12.12", features = ["blocking"] }
serde = { version = "=1.0.217", features = ["derive"] }
serde_derive = "=1.0.217"
serde_json = "=1.0.135"
serde_with = "=3.12.0"
urlencoding = "=2.1.3"
walkdir = "=2.5.0"

# dependencies only used by support binaries (I don't want to download and build these when doing a server release)
pdfium-render = { version = "=0.8.27", optional = true }
image = { version = "=0.25.5", optional = true }

[features]
default = ["binaries"]
binaries = ["dep:pdfium-render", "dep:image"]

[build-dependencies]
dotenv-build = "=0.1.1"
