[package]
name = "harvest-chart-server"
default-run = "harvest-chart-server"
version = "0.1.0"
edition = "2021"

[lib]
doctest = false

[[bin]]
name = "delete_extra_thumbnails"
path = "src/bin/delete_extra_thumbnails.rs"
required-features = ["binaries"]

[[bin]]
name = "pdf_to_thumbnail"
path = "src/bin/pdf_to_thumbnail.rs"
required-features = ["binaries"]

[[bin]]
name = "web_thumbnails"
path = "src/bin/web_thumbnails.rs"
required-features = ["binaries"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
diesel = { version = "=2.3.10", features = ["sqlite", "r2d2"] }
diesel_migrations = "=2.3.2"

# this has to be within the allowed versions for diesel-rs - note we're on the 2.0.x branch (latest stable)
# see https://github.com/diesel-rs/diesel/blob/2.0.x/diesel/Cargo.toml#L19
# see versions here https://crates.io/crates/libsqlite3-sys/versions
libsqlite3-sys = { version = "=0.37.0", features = ["bundled"] }

actix-cors = "=0.7.1"
actix-web = "=4.14.0"
anyhow = "=1.0.103"
base64 = "=0.22.1"
chrono = "=0.4.45"
clap = { version = "=4.6.1", features = ["cargo"] }
dotenv-build = "=0.1.1"
env_logger = "=0.11.11"
expiring_map = { git = "https://github.com/larsonmpdx/expiring_map/", branch = "remove_item" }
git2 = "=0.21.0"
indexmap = "=2.14.0"
itertools = "=0.15.0"
json5 = "=1.3.1"
lazy_static = "=1.5.0"
more-asserts = "=0.3.1"
oauth2 = { version = "=5.0.0", features = ["reqwest-blocking"] }
once_cell = "=1.21.4"
pathdiff = "=0.2.3"
rand = "=0.10.1"
regex = "=1.12.4"
serde = { version = "=1.0.228", features = ["derive"] }
serde_derive = "=1.0.228"
serde_json = "=1.0.150"
serde_with = "=3.21.0"
urlencoding = "=2.1.3"
walkdir = "=2.5.0"

# dependencies only used by support binaries (I don't want to download and build these when doing a server release)
pdfium-render = { version = "=0.9.2", optional = true }
image = { version = "=0.25.10", optional = true }

[features]
default = ["binaries"]
binaries = ["dep:pdfium-render", "dep:image"]

[build-dependencies]
dotenv-build = "=0.1.1"
